services:
  web:
    image: "${RADAR_IMAGE:-ghcr.io/annoyingvillager/research-radar:latest}"
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
    ports:
      - "${WEB_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./papers:/app/papers

  worker:
    image: "${RADAR_IMAGE:-ghcr.io/annoyingvillager/research-radar:latest}"
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "scheduler"]
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./papers:/app/papers
    depends_on:
      - web

