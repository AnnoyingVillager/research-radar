[project]
name = "article-search-radar"
version = "0.1.0"
description = "Venue-first research radar for aeroacoustics, acoustics, and fluid mechanics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5.1,<6",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0,<7",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".python", ".uv-cache", ".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

