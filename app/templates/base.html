<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>{{ app_name }}</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/">近期论文</a>
        <a href="/reports">报告归档</a>
        <a href="/health">运行状态</a>
        {% if current_user %}
        <a href="/settings">系统设置</a>
        <form class="nav-form" method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="nav-button" type="submit">退出</button>
        </form>
        {% else %}
        <a href="/login">管理员登录</a>
        {% endif %}
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="footer">
    <div class="container footer-inner">
      <span>本地部署 · 数据保存在当前主机</span>
      <span>敏感设置加密存储 · 全文访问遵循学校订阅许可</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
